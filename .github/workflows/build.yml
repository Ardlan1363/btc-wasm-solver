name: Build WASM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WASM (بدون wasm-opt)
        run: wasm-pack build --target web --release -- --no-opt 2>&1 || wasm-pack build --target web --release 2>&1 || cargo build --target wasm32-unknown-unknown --release

      - name: Setup wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.100 || echo "already installed"

      - name: Run wasm-bindgen manually
        run: |
          mkdir -p pkg
          wasm-bindgen --target web --out-dir pkg --out-name btc_wasm_solver target/wasm32-unknown-unknown/release/btc_wasm_solver.wasm || true

      - name: Show output
        run: ls -la pkg/ || echo "pkg not found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: pkg/
          retention-days: 30
